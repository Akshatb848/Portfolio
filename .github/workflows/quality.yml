name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, build, e2e + a11y, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Generate asset manifest (gitignored, normally created by prebuild)
        run: node scripts/generate-asset-manifest.mjs
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Playwright smoke + axe (desktop and mobile)
        run: npx playwright test
      - name: Lighthouse CI (a11y, best practices, SEO must pass; performance warns below 80)
        run: npx --yes @lhci/cli@0.15.x autorun
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
